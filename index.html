<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 명함</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f0fdf4;       
            --card-bg: #ffffff;
            --primary-color: #16a34a;  
            --primary-dark: #15803d;   
            --text-main: #0f172a;
            --text-sub: #475569;
            --table-border: #bbf7d0;    
            --available-bg: #dcfce7;   
            --available-text: #166534; 
            --box-bg: #f8fafc;          
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 명함 카드 스타일 */
        .business-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 390px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(22, 163, 74, 0.05);
            overflow: hidden;
            position: relative;
        }

        
        .card-cover {
            height: 120px;
            background: linear-gradient(135deg, #bbf7d0, #4ade80, #16a34a);
        }

        /* 프로필 섹션 */
        .profile-section {
            text-align: center;
            padding: 0 24px 12px 24px;
            position: relative;
            margin-top: -60px;
        }

        .profile-img-label {
            display: inline-block;
            position: relative;
            cursor: pointer;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid var(--card-bg);
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.12);
            background-color: #eee;
            transition: opacity 0.2s;
        }

        .profile-img-label:hover .profile-img {
            opacity: 0.85;
        }

        /* 이미지 교체 안내 아이콘 뱃지 */
        .file-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background-color: var(--primary-color);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
            border: 3px solid var(--card-bg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        #profile-upload {
            display: none;
        }

        .company-name {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-sub);
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .name-container {
            margin-top: 8px;
        }

        .name-ko {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .name-en {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-left: 6px;
        }

        .job-title {
            font-size: 0.95rem;
            color: var(--primary-color);
            font-weight: 500;
            margin-top: 4px;
        }

        /* 연락처 저장 버튼 */
        .save-btn-container {
            padding: 0 24px;
            margin-top: 8px;
            margin-bottom: 16px;
        }

        .save-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
        }

        .save-btn:active {
            background-color: var(--primary-dark);
        }

        /* 스터디 섹션 타이틀 */
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            padding: 12px 24px 8px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 스터디 시간표 스타일 */
        .timetable-container {
            padding: 0 24px;
            margin-bottom: 16px;
        }

        .timetable {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--table-border);
        }

        .timetable th {
            background-color: rgba(22, 163, 74, 0.06);
            color: var(--text-main);
            font-weight: 500;
            padding: 8px;
            border-bottom: 1px solid var(--table-border);
        }

        .timetable td {
            padding: 10px 6px;
            border-bottom: 1px solid var(--table-border);
            border-right: 1px solid var(--table-border);
            color: var(--text-sub);
        }

        .timetable td:last-child {
            border-right: none;
        }

        /* 스터디/모임 가능 시간 강조 */
        .time-available {
            background-color: var(--available-bg);
            color: var(--available-text);
            font-weight: 700;
        }

        /* 상세 연락처 및 링크 리스트 */
        .contact-list {
            padding: 0 24px 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background-color: var(--box-bg);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid rgba(22, 163, 74, 0.03);
            transition: background 0.2s, transform 0.1s;
        }

        .contact-item:active {
            background-color: #f1f5f9;
            transform: scale(0.98);
        }

        .contact-icon {
            width: 36px;
            height: 36px;
            background-color: var(--available-bg);
            color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .contact-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .contact-value {
            font-size: 0.95rem;
            font-weight: 400;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="business-card">
        <div class="card-cover"></div>

        <div class="profile-section">
            <label for="profile-upload" class="profile-img-label">
                <img id="profile-view" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="프로필 사진" class="profile-img">
                <div class="file-badge"><i class="fa-solid fa-camera"></i></div>
            </label>
            <input type="file" id="profile-upload" accept="image/*">
            
            <div class="company-name">경남정보대학교</div>
            
            <div class="name-container">
                <span class="name-ko">도연서</span>
                <span class="name-en">YeonSeo Do</span>
            </div>
            <div class="job-title">AI컴퓨터과 / 1학년</div>
        </div>

        <div class="save-btn-container">
            <button class="save-btn" id="downloadVCF">
                <i class="fa-solid fa-user-plus"></i> 연락처 휴대폰에 저장
            </button>
        </div>

        <div class="section-title">
            <i class="fa-regular fa-calendar-days" style="color: var(--primary-color);"></i>
            스터디 및 팀플 가능 시간
        </div>
        <div class="timetable-container">
            <table class="timetable">
                <thead>
                    <tr>
                        <th>시간</th>
                        <th>월</th>
                        <th>화</th>
                        <th>수</th>
                        <th>목</th>
                        <th>금</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>오전</td>
                        <td>수업</td>
                        <td>수업</td>
                        <td>수업</td>
                        <td>수업</td>
                        <td>개인</td>
                    </tr>
                    <tr>
                        <td>오후</td>
                        <td class="time-available">가능</td>
                        <td>수업</td>
                        <td>수업</td>
                        <td>수업</td>
                        <td>개인</td>
                    </tr>
                    <tr>
                        <td>저녁</td>
                        <td class="time-available">가능</td>
                        <td class="time-available">가능</td>
                        <td>개인</td>
                        <td class="time-available">가능</td>
                        <td>개인</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-address-book" style="color: var(--primary-color);"></i>
            상세 연락처
        </div>
        <div class="contact-list">
            <a href="tel:010-1234-5678" class="contact-item">
                <div class="contact-icon"><i class="fa-solid fa-phone"></i></div>
                <div class="contact-info">
                    <span class="contact-label">전화번호</span>
                    <span class="contact-value">010-****-***1</span>
                </div>
            </a>

            <a href="mailto:gildong@example.com" class="contact-item">
                <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="contact-info">
                    <span class="contact-label">이메일</span>
                    <span class="contact-value">ysys_0@naver.com</span>
                </div>
            </a>

            <a href="https://map.naver.com/v5/search/부산 사상구 주례로 45" target="_blank" rel="noopener noreferrer" class="contact-item">
                <div class="contact-icon"><i class="fa-solid fa-location-dot"></i></div>
                <div class="contact-info">
                    <span class="contact-label">학교 주소</span>
                    <span class="contact-value">부산 사상구 주례로 45</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        // 프로필 사진 직접 선택 및 실시간 미리보기 로직
        document.getElementById('profile-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('profile-view').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 연락처(VCF 파일) 자동 생성 및 다운로드 기능
        document.getElementById('downloadVCF').addEventListener('click', function() {
            const info = {
                name: '도연서',
                phone: '010-****-***1',
                email: 'ysys_0@naver.com',
                org: '경남정보대학교',
                title: 'AI컴퓨터과/1학년',
                address: '부산광역시 사상구 주례로 45'
            };

            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${info.name};;;`,
                `FN:${info.name}`,
                `ORG:${info.org}`,
                `TITLE:${info.title}`,
                `TEL;TYPE=CELL:${info.phone}`,
                `EMAIL;TYPE=PREF,INTERNET:${info.email}`,
                `ADR;TYPE=WORK:;;${info.address};;;;`,
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
            const filename = `${info.name}_명함.vcf`;

            if (navigator.msSaveBlob) { 
                navigator.msSaveBlob(blob, filename);
            } else {
                const link = document.createElement('a');
                if (link.download !== undefined) {
                    const url = URL.createObjectURL(blob);
                    link.setAttribute('href', url);
                    link.setAttribute('download', filename);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
        });
    </script>
</body>
</html>
