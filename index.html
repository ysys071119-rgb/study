<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사진 및 일정 기록소</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --text-color: #333333;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* 입력 폼 스타일 */
        .upload-form {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
            box-sizing: border-box;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group.no-margin {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .form-group input[type="file"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group textarea {
            resize: none;
            height: 90px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #1a252f;
        }

        /* 갤러리 리스트 스타일 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.12);
        }

        /* 카드 클릭 시 삭제용 오버레이 */
        .card::after {
            content: '🗑️ 클릭하여 삭제';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(231, 76, 60, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 2;
        }

        .card:hover::after {
            opacity: 1;
        }

        .card-img-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 이미지 위 날짜 배지 표시 */
        .card-date-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1;
        }

        .card-content {
            padding: 15px;
        }

        .card-caption {
            font-size: 14px;
            color: #444;
            line-height: 1.5;
            margin: 0;
            word-break: break-all;
            white-space: pre-wrap; /* 줄바꿈 유지 */
        }

        .empty-message {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            font-style: italic;
            margin-top: 30px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>📅 사진 & 일정 다이어리</h1>

    <!-- 데이터 입력 구역 -->
    <div class="upload-form">
        <div class="form-row">
            <div class="form-group no-margin">
                <label for="imageInput">사진 업로드</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <div class="form-group no-margin">
                <label for="dateInput">날짜 선택</label>
                <input type="date" id="dateInput">
            </div>
        </div>
        <div class="form-group">
            <label for="captionInput">부연 설명</label>
            <textarea id="captionInput" placeholder="이날의 추억이나 일정을 메모해 두세요..."></textarea>
        </div>
        <button class="submit-btn" onclick="addSchedule()">추억 등록하기</button>
    </div>

    <hr style="width: 100%; max-width: 1200px; border: 0; height: 1px; background: #ddd; margin-bottom: 40px;">

    <!-- 리스트 출력 구역 -->
    <div class="gallery" id="gallery">
        <div class="empty-message" id="emptyMessage">등록된 기록이 없습니다. 새로운 일정을 등록해 보세요!</div>
    </div>

    <script>
        // 일정 데이터를 관리할 배열
        let scheduleList = [];

        const imageInput = document.getElementById('imageInput');
        const dateInput = document.getElementById('dateInput');
        const captionInput = document.getElementById('captionInput');
        const gallery = document.getElementById('gallery');
        const emptyMessage = document.getElementById('emptyMessage');

        // 페이지 로드 시 오늘 날짜를 기본값으로 지정
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        };

        // 데이터 등록 함수
        function addSchedule() {
            const file = imageInput.files[0];
            const dateValue = dateInput.value;
            const caption = captionInput.value.trim();

            if (!file) {
                alert('사진을 업로드해 주세요!');
                return;
            }
            if (!dateValue) {
                alert('날짜를 선택해 주세요!');
                return;
            }

            // FileReader를 통해 이미지를 Base64 데이터 스트링으로 변환
            const reader = new FileReader();
            reader.onload = function(e) {
                const item = {
                    id: Date.now(), // 고유 식별자 고유 ID 생성
                    imageSrc: e.target.result,
                    date: dateValue,
                    caption: caption || '부연 설명이 없습니다.'
                };

                scheduleList.push(item);
                
                // 날짜 기준 오름차순(과거->미래) 정렬 (원한다면 내림차순도 가능)
                scheduleList.sort((a, b) => new Date(a.date) - new Date(b.date));

                renderGallery();
                resetForm();
            };
            
            reader.readAsDataURL(file);
        }

        // 입력 폼 초기화 함수
        function resetForm() {
            imageInput.value = '';
            captionInput.value = '';
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        }

        // 카드 클릭 시 삭제 실행 함수
        function deleteSchedule(id) {
            if (confirm('선택한 일정과 사진을 삭제하시겠습니까?')) {
                scheduleList = scheduleList.filter(item => item.id !== id);
                renderGallery();
            }
        }

        // 화면 갱신 렌더링 함수
        function renderGallery() {
            // 기존 카드들 청소
            const existingCards = gallery.querySelectorAll('.card');
            existingCards.forEach(card => card.remove());

            if (scheduleList.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            } else {
                emptyMessage.style.display = 'none';
            }

            // 정렬된 리스트 순서대로 화면에 배치
            scheduleList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => deleteSchedule(item.id);

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <span class="card-date-badge">${item.date}</span>
                        <img src="${item.imageSrc}" alt="일정 사진">
                    </div>
                    <div class="card-content">
                        <p class="card-caption">${escapeHtml(item.caption)}</p>
                    </div>
                `;

                gallery.appendChild(card);
            });
        }

        // 보안 처리를 위한 텍스트 치환 함수 (XSS 방지)
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
